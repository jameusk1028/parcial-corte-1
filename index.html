<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calculadora de Cotización de Envío Parcial 1</title>

    <link rel="stylesheet" href="Styles/main.css">

    <script type="module" src="Scripts/main.js"></script>

</head>


<body>

    <header>

        <h1>
            Calculadora de Cotización de Envío Parcial 1
        </h1>

    </header>


    <main>

        <section class="calculadora">

            <h2>
                Datos del envío
            </h2>


            <form id="formularioEnvio">

                <div class="campo">

                    <label for="nombreCliente">
                        Nombre del cliente
                    </label>

                    <input
                        type="text"
                        id="nombreCliente"
                        placeholder="Ingrese el nombre del cliente"
                    >

                </div>


                <div class="campo">

                    <label for="pesoKg">
                        Peso del paquete (kg)
                    </label>

                    <input
                        type="number"
                        id="pesoKg"
                        placeholder="Ej: 2.5"
                        step="0.01"
                    >

                </div>


                <div class="campo">

                    <label for="distanciaKm">
                        Distancia (km)
                    </label>

                    <input
                        type="number"
                        id="distanciaKm"
                        placeholder="Ej: 100"
                        step="1"
                    >

                </div>


                <div class="campo">

                    <label for="codigoDescuento">
                        Código de descuento
                    </label>

                    <input
                        type="text"
                        id="codigoDescuento"
                        placeholder="Opcional"
                    >

                </div>


                <button type="button" id="calcular">
                    Calcular
                </button>

            </form>


            <div id="error"></div>


            <section class="resultado">

                <h2>
                    Resultado
                </h2>

                <div id="resultado">
                </div>

            </section>

        </section>

    </main>


    <footer>

        <p>
            Juan Andres Muñoz - 2241564
        </p>

    </footer>


</body>

</html>
